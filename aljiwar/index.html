<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#252525">
    <title>ALJIWAR CO.</title>
    <style>
        :root {
            --ink: #252525;
            --gold: #9a8455;
            --paper: #ffffff;
            --soft: #f5f3ee;
            --muted: #77746d;
        }
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 18px 12px;
            background: #eae8e2;
            color: var(--ink);
            font-family: Tahoma, Arial, sans-serif;
        }
        .card {
            max-width: 430px;
            margin: auto;
            background: var(--paper);
            border: 1px solid #dedbd2;
            box-shadow: 0 8px 30px #0000000c;
            overflow: hidden;
        }
        .header {
            padding: 24px 18px 19px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
        }
        .logo {
            display: block;
            width: 100px;
            height: 75px;
            margin: 0 auto 10px;
            object-fit: contain;
        }
        .company {
            direction: ltr;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
        }
        .body-content { padding: 22px 20px; }
        .section-title { font-size: 18px; margin: 0 0 16px; }
        .model-badge {
            display: inline-block;
            direction: ltr;
            background: var(--ink);
            color: white;
            padding: 7px 15px;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .info-box {
            background: var(--soft);
            padding: 14px;
            border-right: 3px solid var(--gold);
        }
        .label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .value { font-size: 18px; font-weight: bold; }
        .color-value {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-swatch {
            width: 19px;
            height: 19px;
            border-radius: 50%;
            background: #a7a29a;
            border: 1px solid #77736b;
            flex-shrink: 0;
        }
        hr {
            border: 0;
            border-top: 1px solid #e6e2d9;
            margin: 22px 0;
        }
        .drawing-title { font-size: 16px; margin: 0 0 14px; }
        .drawing {
            padding: 12px 5px 8px;
            background: #faf9f6;
            border: 1px solid #eeece5;
            text-align: center;
        }
        .drawing svg { width: 100%; height: auto; display: block; }
        .product-image {
            width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: 4px;
            display: block;
        }
        .note {
            font-size: 10px;
            color: var(--muted);
            text-align: center;
            margin: 8px 0 2px;
        }
        .dimensions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 16px;
        }
        .dimension {
            padding: 12px;
            border: 1px solid #e5e1d8;
            text-align: center;
        }
        .dimension-label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }
        .dimension-value {
            direction: ltr;
            font-size: 21px;
            font-weight: bold;
        }
        .footer {
            background: var(--ink);
            color: white;
            text-align: center;
            padding: 17px 10px;
        }
        .footer-brand {
            color: #d8c7a0;
            font-size: 12px;
            direction: ltr;
            letter-spacing: 2px;
        }
        .footer-caption {
            color: #d8c7a0;
            margin-top: 7px;
            font-size: 11px;
            direction: ltr;
            letter-spacing: 1px;
        }
        .error {
            max-width: 430px;
            margin: 40px auto;
            padding: 30px 20px;
            background: white;
            border: 1px solid #dedbd2;
            text-align: center;
            color: #a52b2b;
        }
        @media print {
            @page { margin: 0; }
            body { padding: 0; background: white; }
            .card { box-shadow: none; border: 0; }
        }
    </style>
</head>
<body>
<main class="card" id="door-card" hidden>
    <header class="header">
        <img class="logo" src="logo.png" alt="ALJIWAR CO. Logo" onerror="this.style.display='none'">
        <h1 class="company">ALJIWAR CO.</h1>
    </header>
    <section class="body-content">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <h2 class="section-title" style="margin:0">معلومات الباب</h2>
            <span class="model-badge" id="model-badge"></span>
        </div>
        <div class="info-grid">
            <div class="info-box" id="product-code-box" style="grid-column: 1 / -1;" hidden>
                <div class="label">رمز المنتج (Code)</div>
                <div class="value" dir="ltr" id="product-code"></div>
            </div>
            <div class="info-box">
                <div class="label">اللون</div>
                <div class="value color-value">
                    <span class="color-swatch" id="color-swatch"></span>
                    <span id="color-name"></span>
                </div>
            </div>
            <div class="info-box">
                <div class="label">رقم الموديل</div>
                <div class="value" dir="ltr" id="model-number"></div>
            </div>
        </div>
        <hr>
        <h3 class="drawing-title" id="media-title">صورة المنتج والقياسات</h3>
        <div class="drawing" id="media-container">
            <svg id="default-svg" viewBox="0 0 320 300" role="img" aria-label="رسم توضيحي لأبعاد الباب">
                <defs>
                    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse">
                        <path d="M0 5 L5 0" stroke="#c8c3b8" stroke-width=".5"/>
                    </pattern>
                </defs>
                <g stroke="#9a8455" stroke-width="1" fill="none">
                    <path d="M75 36 V17 M231 36 V17 M75 24 H231"/>
                    <path d="M75 24 l7 -3 M75 24 l7 3 M231 24 l-7 -3 M231 24 l-7 3"/>
                </g>
                <rect id="door-main" x="75" y="36" width="156" height="232" fill="#b4b0a7" stroke="#393936" stroke-width="2"/>
                <rect x="84" y="45" width="138" height="214" fill="none" stroke="#6d6a63" stroke-width="1.5"/>
                <rect x="92" y="53" width="122" height="198" fill="url(#hatch)" stroke="#e3ded4"/>
                <rect x="101" y="62" width="104" height="180" fill="#b7b2a8" stroke="#77736b" stroke-width="1.2" id="door-inner"/>
                <rect x="109" y="70" width="88" height="164" fill="none" stroke="#d9d4ca"/>
                <circle cx="190" cy="153" r="4" fill="#514b40" stroke="#e5d6ae" stroke-width="1.5"/>
                <path d="M190 157 V164" stroke="#514b40" stroke-width="2"/>
                <g stroke="#9a8455" stroke-width="1.2" fill="none">
                    <path d="M75 279 H231"/>
                    <path d="M75 272 V286 M231 272 V286"/>
                    <path d="M75 279 l7 -3 M75 279 l7 3 M231 279 l-7 -3 M231 279 l-7 3"/>
                    <path d="M248 36 H270 M248 268 H270 M260 36 V268"/>
                    <path d="M260 36 l-3 7 M260 36 l3 7 M260 268 l-3 -7 M260 268 l3 -7"/>
                </g>
                <g fill="#6e5c35" font-size="11" font-weight="600">
                    <text x="153" y="15" text-anchor="middle" id="svg-width">61 cm</text>
                    <text x="276" y="152" text-anchor="middle" transform="rotate(90 276 152)" id="svg-height">213 cm</text>
                    <text x="153" y="296" text-anchor="middle">WIDTH</text>
                </g>
            </svg>
            <p class="note" id="media-note">رسم توضيحي — النسب تقريبية وليست مخطط تصنيع</p>
        </div>
        <div class="dimensions">
            <div class="dimension">
                <div class="dimension-label">الطول</div>
                <div class="dimension-value" id="height-value"></div>
            </div>
            <div class="dimension">
                <div class="dimension-label">العرض</div>
                <div class="dimension-value" id="width-value"></div>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="footer-brand">ALJIWAR CO.</div>
        <div class="footer-caption">
            تصميم وبرمجة: <a href="https://itbrok.github.io" target="_blank" rel="noopener noreferrer" style="color:#d8c7a0; text-decoration:underline;">محمد آل ثميل</a>
        </div>
    </footer>
</main>
<div class="error" id="error-message" hidden>
    <h2>تعذر عرض بيانات الباب</h2>
    <p id="error-description">رابط QR غير صالح أو يحتوي على بيانات غير صحيحة.</p>
</div>

<script>
"use strict";

const workerUrl = 'https://github-uploader-worker.mhmdthumail.workers.dev';

function renderDoor(config) {
    const codeBox = document.getElementById("product-code-box");
    if (config.code) {
        document.getElementById("product-code").textContent = config.code;
        codeBox.hidden = false;
    } else {
        codeBox.hidden = true;
    }

    document.getElementById("model-badge").textContent = config.model;
    document.getElementById("model-number").textContent = config.model;
    document.getElementById("color-name").textContent = config.color;

    document.getElementById("height-value").textContent = config.height + " cm";
    document.getElementById("width-value").textContent = config.width + " cm";
    document.getElementById("svg-width").textContent = config.width + " cm";
    document.getElementById("svg-height").textContent = config.height + " cm";

    const mediaContainer = document.getElementById("media-container");
    const mediaTitle = document.getElementById("media-title");

    if (config.image) {
        mediaTitle.textContent = "صورة الباب الفعلي";
        mediaContainer.innerHTML = `
            <img src="https://raw.githubusercontent.com/itbrok/aljiwar.net/main/uploads/${config.image}" alt="صورة الباب للموديل ${config.model}" class="product-image" onerror="this.onerror=null; this.src='logo.png';">
            <p class="note">صورة حقيقية للمنتج المطلوب</p>
        `;
    }

    document.getElementById("door-card").hidden = false;
}

async function loadDoor() {
    const params = new URLSearchParams(window.location.search);
    const sellId = params.get("sell");
    const itemSerial = params.get("item");

    if (!sellId || !itemSerial) {
        throw new Error("رابط QR غير مكتمل أو مفقود المعرفات.");
    }

    const cacheFilePath = `cache/sell_${sellId}.json`;
    const res = await fetch(`${workerUrl}?path=${cacheFilePath}`);
    const result = await res.json();

    if (!result.exists || !result.data || !result.data[itemSerial]) {
        throw new Error("لم يتم العثور على بيانات هذا المنتج في السحابة.");
    }

    const itemData = result.data[itemSerial];

    return {
        code: itemData.code || null,
        model: itemData.model,
        color: itemData.color || "غير محدد",
        width: itemData.width,
        height: itemData.height,
        image: itemData.image || null
    };
}

function showError(error) {
    document.getElementById("door-card").hidden = true;
    document.getElementById("error-message").hidden = false;
    document.getElementById("error-description").textContent = error.message;
}

(async function() {
    try {
        const config = await loadDoor();
        renderDoor(config);
    } catch (error) {
        console.error(error);
        showError(error);
    }
})();
</script>
</body>
</html>
