<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARAD - تحميل التطبيق</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7f6;
            font-family: Arial, sans-serif;
            color: #17201c;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 24px;
            padding: 40px 28px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 22px;
            border-radius: 22px;
            background: #0f5c4d;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .description {
            margin: 0 auto 28px;
            color: #69736f;
            font-size: 15px;
            line-height: 1.7;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 15px 20px;
            border-radius: 14px;
            background: #0f5c4d;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .download-btn:hover {
            background: #0b4b3f;
            transform: translateY(-1px);
        }

        .note {
            margin-top: 18px;
            font-size: 12px;
            color: #8a9390;
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="logo">
            ARAD
        </div>

        <h1>تطبيق ARAD</h1>

        <p class="description">
            حمّل تطبيق ARAD على جهاز Android وابدأ باستخدام التطبيق.
        </p>

        <a
            class="download-btn"
            href="ARAD.apk"
            download
        >
            تحميل التطبيق
        </a>

        <div class="note">
            الإصدار متوفر لأجهزة Android
        </div>

    </main>

</body>
</html>
